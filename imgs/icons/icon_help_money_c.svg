Use code with caution.
Если вам нужно сделать квадратный белый фон для всего изображения целиком (вместо круглых подложек под элементы), дайте знать — я заменю круги на один общий прямоугольник.
Что вы планируете делать дальше, протестировать этот код на сайте или сохранить его в файл?






Конечно, присылайте код второй иконки (или просто прикрепите файл).
Я точно так же отредактирую её, добавлю белую подложку и верну вам готовый вариант.
Жду ваш код!






В этой иконке структура кода похожа на предыдущую: основной большой круг находится в левом верхнем углу (координаты 0,0), а второй, поменьше, смещен вправо и вниз.
