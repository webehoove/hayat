Да, я могу это сделать. Чтобы заполнить пустые (прозрачные) области внутри вашего SVG белым цветом, мне нужно увидеть сам код.
Обычно для этого внутри тега <svg> добавляется фоновый прямоугольник, либо меняются атрибуты fill (заливка) у конкретных контуров (<path>).
Пришлите мне код вашего SVG текстом.
После того как вы прикрепите код, я отредактирую его и пришлю вам готовую версию. Из какого источника этот SVG (иконка, логотип, иллюстрация)?






Чтобы сделать прозрачные области внутри иконки белыми, нужно добавить подложку, которая повторит форму самого знака, но будет залита белым цветом.
В вашем файле находятся два больших круга (один по координатам 0,0, а второй смещен вправо-вниз). Я добавил для каждого из них точную белую копию-подложку (fill="#FFFFFF") и поместил их на самый нижний слой, чтобы они не перекрывали темно-синие элементы.
